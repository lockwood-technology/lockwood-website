<!--
  Lockwood Technology Email Signature — Personal / Staff
  Use case: paste into Gmail / Outlook signature settings.
  Customise: NAME, ROLE, MOBILE, calendar link.
  Two-column layout: brand mark left, contact details right.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#111111;">
  <tr>
    <!-- Left: brand mark -->
    <td valign="top" style="padding:0 20px 0 0;border-right:2px solid #1f49ff;">
      <img src="https://lockwood.co.tz/logos/lockwood-mark.png" width="56" height="56" alt="Lockwood" style="display:block;border:0;outline:none;text-decoration:none;width:56px;height:56px;">
    </td>
    <!-- Right: details -->
    <td valign="top" style="padding:0 0 0 20px;">
      <div style="font-size:16px;font-weight:700;letter-spacing:-0.01em;color:#111111;line-height:1.2;">{{NAME}}</div>
      <div style="font-size:13px;color:#43434c;margin-top:2px;line-height:1.4;">{{ROLE}} &middot; Lockwood Technology</div>
      <div style="font-size:12px;color:#63636e;margin-top:8px;line-height:1.6;">
        <a href="mailto:{{EMAIL}}" style="color:#43434c;text-decoration:none;">{{EMAIL}}</a>
        &nbsp;&middot;&nbsp;
        <a href="tel:{{PHONE_E164}}" style="color:#43434c;text-decoration:none;">{{PHONE}}</a>
      </div>
      <div style="font-size:12px;color:#63636e;margin-top:2px;line-height:1.6;">
        <a href="https://lockwood.co.tz" style="color:#1f49ff;text-decoration:none;font-weight:600;">lockwood.co.tz</a>
        &nbsp;&middot;&nbsp;
        <a href="https://linkedin.com/company/lockwoodtech" style="color:#63636e;text-decoration:none;">LinkedIn</a>
        &nbsp;&middot;&nbsp;
        <a href="{{CALENDAR_LINK}}" style="color:#63636e;text-decoration:none;">Book a call</a>
      </div>
      <div style="font-size:10px;color:#8e8e99;margin-top:10px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600;">
        Built for East Africa
      </div>
    </td>
  </tr>
</table>
